<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảo trì hệ thống</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      color: #374151;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #AE1C40;
      margin-bottom: 0.75rem;
    }
    .desc {
      font-size: 1rem;
      line-height: 1.6;
      color: #6b7280;
      margin-bottom: 1.5rem;
    }
    .time {
      display: inline-block;
      background-color: #FDE6EA;
      color: #AE1C40;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔧</div>
    <h1>Hệ thống đang bảo trì</h1>
    <p class="desc">
      Hệ thống đang tạm ngưng hoạt động để xử lý dữ liệu.
      Vui lòng quay lại sau.
    </p>
    <span class="time">Thời gian dự kiến: khoảng 30 phút</span>
  </div>
</body>
</html>
